plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
// Signing: the project ships a release keystore so CI can produce an APK that
// keeps updating over previous installs. Repository secrets can override it by
// writing keystore.properties (gitignored) in the workflow. See README.
def secretProps = rootProject.file("keystore.properties")
def repoProps = rootProject.file("release-signing.properties")
def propsFile = secretProps.exists() ? secretProps : (repoProps.exists() ? repoProps : null)
def ksProps = new Properties()
if (propsFile != null) { propsFile.withInputStream { ksProps.load(it) } }
def signingStore = ksProps['storeFile'] ? rootProject.file(ksProps['storeFile']) : null
def hasReleaseSigning = signingStore != null && signingStore.exists()
def appVersionName = (project.findProperty("appVersionName") ?: "1.0").toString()
def appVersionCode = (project.findProperty("appVersionCode") ?: "2").toString().toInteger()
android {
    namespace 'com.kothakoi.app'
    compileSdk 35
    buildToolsVersion "35.0.0"
    defaultConfig {
        applicationId "com.kothakoi.app"
        minSdk 24
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile signingStore
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
}
