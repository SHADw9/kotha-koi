name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Work out version and tag
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
            TAG="v${VERSION}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (version $VERSION)"

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: kotha-koi ${{ steps.version.outputs.version }}
          body: |
            **kotha-koi** — offline English learning from A1 to C2.

            - Android APK (sideload)
            - Windows installer
            - Linux AppImage / deb
            - Standalone web build (zip)

            Five colour themes, a quieter Material interface, and the same
            offline lessons, practice questions and interview drill.
          generate_release_notes: true
          make_latest: true

  web:
    name: Build web bundle
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync shared web assets
        run: python scripts/sync-web.py
      - name: Zip the web app
        run: |
          cd web
          zip -r "../kotha-koi-web-${{ needs.prepare.outputs.version }}.zip" .
      - name: Upload web zip to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: kotha-koi-web-${{ needs.prepare.outputs.version }}.zip

  android:
    name: Build Android APK
    needs: prepare
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync shared web assets
        run: python scripts/sync-web.py

      - name: Configure release signing (optional)
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Using release keystore from repository secrets."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.keystore
            cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret set — using the keystore committed at android/kotha-koi-release.keystore."
          fi

      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon \
            -PappVersionName=${{ needs.prepare.outputs.version }} \
            -PappVersionCode=${{ github.run_number }}

      - name: Name the APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             "kotha-koi-${{ needs.prepare.outputs.version }}.apk"

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: kotha-koi-${{ needs.prepare.outputs.version }}.apk

  desktop:
    name: Build desktop (${{ matrix.platform }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop/src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libayatana-appindicator3-dev

      - name: Sync shared web assets
        run: python scripts/sync-web.py

      - name: Build desktop app (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: kotha-koi ${{ needs.prepare.outputs.version }}
          releaseBody: 'Offline English A1–C2 learning for desktop.'
          releaseDraft: false
          prerelease: false
